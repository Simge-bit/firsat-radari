<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Fırsat Radarı paylaşım görseli</title>
<style>
  /* Paylaşım görseli (1200x630). web/og.png bu sayfanın 1200x630 ekran görüntüsüdür. */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b0c0f; color: #e8eaed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; position: relative;
         background-image: radial-gradient(900px 560px at 92% -12%, rgba(227, 10, 23, .34), transparent 62%), radial-gradient(600px 380px at -5% 115%, rgba(227, 10, 23, .14), transparent 60%); }
  body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .1) 1px, transparent 1.3px); background-size: 28px 28px;
                 -webkit-mask-image: linear-gradient(120deg, #000 0%, transparent 70%); }
  .in { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 52px; height: 52px; }
  h1 { font-size: 86px; line-height: 1.02; font-weight: 760; letter-spacing: -.035em; margin: 0 0 22px; max-width: 900px; }
  p { font-size: 30px; line-height: 1.35; color: #9aa0ab; margin: 0; max-width: 820px; }
  .foot { display: flex; gap: 14px; font-size: 22px; font-weight: 600; color: #c9ced6; }
  .foot span { border: 1px solid #343944; background: rgba(19, 21, 26, .8); border-radius: 999px; padding: 10px 20px; }
  .rings { position: absolute; right: -150px; bottom: -190px; width: 620px; height: 620px; opacity: .5; }
</style>
</head>
<body>
<svg class="rings" viewBox="0 0 400 400" fill="none" stroke="#e30a17" stroke-width="1.4"><circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="142"/><circle cx="200" cy="200" r="94"/><circle cx="200" cy="200" r="46"/><path d="M200 200 66 66" stroke-width="2.4"/></svg>
<div class="in">
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#e30a17"/><circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M16 16 22.5 9.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#fff"/></svg>
    Fırsat Radarı
  </div>
  <div>
    <h1>Ürününü yaz, nereye satacağını gör.</h1>
    <p>Hangi ülkede talep büyüyor, Türkiye'nin payı ne, rakiplerin kim. Resmi ticaret verisiyle saniyeler içinde.</p>
  </div>
  <div class="foot"><span>5.911 ürün</span><span>150+ ülke</span><span>Resmi gümrük verisi</span></div>
</div>
</body>
</html>
