services:
  - type: web
    name: ihracbul
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python server.py
    healthCheckPath: /robots.txt
    envVars:
      # Veri anahtarları kurulumda sorulur; depoda tutulmaz.
      - key: COMTRADE_KEY
        sync: false
      - key: WTO_KEY
        sync: false
      # Erişim belirteçlerini imzalayan anahtar; Render bir kez üretir ve saklar.
      - key: IHRACBUL_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
# Render panelinden eklenenler (depoda tutulmaz):
#   TURSO_URL, TURSO_TOKEN: üyelerin durduğu kalıcı veritabanı. Verilmezse üyeler yerel dosyada durur ve her yeniden başlatmada silinir.
#   RESEND_API_KEY: giriş e-postaları (Resend, HTTPS). Ücretsiz planda SMTP kapıları kapalı olduğu için SMTP_* burada çalışmaz.
#   ADMIN_PASSWORD: /yonetim panelinin şifresi. Verilmezse panel kapalıdır.
# Gerçek ödeme için Render panelinden eklenir: IYZICO_API_KEY, IYZICO_SECRET_KEY, IYZICO_BASE
#   (deneme: https://sandbox-api.iyzipay.com, gerçek: https://api.iyzipay.com). Anahtarlar yokken ödeme gösterim modunda kalır.
#   IYZICO_PLAN_MONTHLY: aylık aboneliğin plan kodu; tools/iyzico_plan.py bir kez çalıştırılarak alınır. Yokken aylık paket satılmaz.
